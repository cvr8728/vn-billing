<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Void Nodes · Billing</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--card:#fff;--bd:#e5e7eb;--tx:#0f172a;--mu:#64748b;--ac:#7c3aed;--ac2:#ede9fe;--dk:#0f1424;--sub:#f4f4f6}
[data-theme=dark]{--bg:#0b0b10;--card:#12121a;--bd:#25253a;--tx:#e8e8f5;--mu:#9a9ab8;--ac:#8b5cf6;--ac2:#241a4a;--dk:#6d28d9;--sub:#191926}
*{box-sizing:border-box}body{margin:0;font:15px Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}h1,h2,h3,p{margin:0}
#shell{display:flex;gap:0;min-height:100vh;align-items:flex-start}
#side{position:sticky;top:16px;align-self:flex-start;height:fit-content;width:244px;flex:none;margin:16px;padding:14px 12px 16px;background:var(--card);border:1px solid var(--bd);border-radius:18px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 14px;font-size:18px}.brand img{width:30px;height:30px;border-radius:8px}
.nh{font-size:11px;letter-spacing:.08em;color:var(--mu);padding:14px 10px 6px}
#side a{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;color:var(--mu);font-weight:500;cursor:pointer;position:relative}
#side a:hover{background:var(--sub);color:var(--tx)}#side a.on{background:var(--sub);color:var(--tx)}#side a.on svg{color:var(--ac)}#side a.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--ac)}
#side em{margin-left:auto;background:var(--ac);color:#fff;font-style:normal;font-size:11px;border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center}#side em:empty{display:none}
#main{flex:1;min-width:0}header{display:flex;align-items:center;gap:10px;height:64px;padding:0 24px 0 8px}header h2{font-size:17px}.sp{flex:1}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:grid;place-items:center}#mb{display:none}
.av{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:600}
#view{padding:8px 24px 48px 8px;max-width:1100px;perspective:1400px}
.pg{animation:in3d .5s cubic-bezier(.22,1,.36,1) both;transform-origin:50% 0;will-change:transform,opacity}
@keyframes in3d{from{opacity:0;transform:rotateX(7deg) translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.pg>.g>.card,.pg>.card,.pg .plan{animation:in3d .5s cubic-bezier(.22,1,.36,1) both}.pg .plan:nth-child(2){animation-delay:.05s}.pg .plan:nth-child(3){animation-delay:.1s}.pg .plan:nth-child(n+4){animation-delay:.15s}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin:12px 0 20px;flex-wrap:wrap}.ph h1{font-size:28px;font-weight:700}.ph p{color:var(--mu);margin-top:4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;transition:transform .25s,box-shadow .25s}
@media(hover:hover){.plan:hover{transform:translateY(-4px) rotateX(1.5deg);box-shadow:0 14px 30px -14px rgba(124,58,237,.35)}}
.g{display:grid;gap:16px}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g2{grid-template-columns:2fr 1fr}.stat span{color:var(--mu)}.stat b{display:block;font-size:34px;margin-top:10px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--dk);color:#fff;display:inline-flex;align-items:center;gap:8px;justify-content:center}.btn.w{width:100%}.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:#b91c1c}.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--bd);margin-bottom:18px;overflow:auto}.tabs button{background:none;border:0;padding:12px 16px;color:var(--mu);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.on{color:var(--ac);border-color:var(--ac)}
.pills{display:flex;gap:8px;justify-content:center;margin:0 0 20px;flex-wrap:wrap}.pill{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 16px;font-weight:500}.pill.on{background:var(--dk);color:#fff;border-color:transparent}.pill:disabled{opacity:.4;filter:grayscale(1);cursor:not-allowed;text-decoration:line-through}
.plans{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.plan .meta{font-size:12px;color:var(--mu);display:flex;gap:10px}.plan .meta b{color:var(--ac)}.plan h3{font-size:20px;margin:6px 0}.price{font-size:30px;font-weight:700}.price small{font-size:14px;font-weight:400;color:var(--mu)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--sub);border-radius:12px;padding:14px;margin:14px 0;font-size:13px}.specs span{display:block;color:var(--mu);font-size:12px}.ok{color:#16a34a;font-size:14px;margin-bottom:14px}
.empty{text-align:center;padding:60px 10px;color:var(--mu)}.empty svg{width:64px;height:64px;opacity:.35}.empty h3{color:var(--tx);margin:12px 0 4px}.empty .row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.note{border-left:4px solid var(--ac);background:var(--ac2);border-radius:12px;padding:14px 16px;margin-bottom:20px}.note b{display:block;margin-bottom:2px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:12px 10px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500}.tag{padding:3px 10px;border-radius:99px;font-size:12px;background:var(--sub)}.tag.g{background:#dcfce7;color:#166534}.tag.y{background:#fef3c7;color:#92400e}.tag.rd{background:#fee2e2;color:#991b1b}
.sl{margin:18px 0}.sl label{display:flex;justify-content:space-between;margin-bottom:8px}.sl b{color:var(--ac)}
input[type=range]{width:100%;-webkit-appearance:none;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--ac) var(--p),var(--bd) var(--p));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--ac);box-shadow:0 0 12px var(--ac);cursor:grab}
.dots{display:flex;justify-content:space-between;padding:0 8px;margin-top:6px}.dots i{width:5px;height:5px;border-radius:50%;background:var(--bd)}.dots i.a{background:var(--ac)}
.opts{display:flex;gap:10px;flex-wrap:wrap}.opt{flex:1;min-width:140px;border:1px solid var(--bd);border-radius:12px;padding:12px;cursor:pointer;background:var(--card)}.opt.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.opt span{display:block;color:var(--mu);font-size:13px}
.row2{display:flex;justify-content:space-between;color:var(--mu);padding:4px 0}.tot{font-size:30px;font-weight:700}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}#ov.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);border-left:1px solid var(--bd);transform:translateX(105%);transition:transform .3s cubic-bezier(.22,1,.36,1);z-index:50;padding:20px;display:flex;flex-direction:column;gap:14px}#dr.on{transform:none}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:12px;padding:12px}.item small{color:var(--mu);display:block}
.kb{cursor:pointer}.kb p{color:var(--mu);margin-top:6px}.kh{color:var(--ac);font-weight:600;letter-spacing:.04em;margin:22px 0 10px}
input.f,textarea.f,select.f{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--sub);color:var(--tx);font:inherit}
/* auth */
.auth{min-height:100vh;background:#000;color:#fff;display:grid;place-items:center;padding:20px}.auth .box{width:100%;max-width:440px}.auth .logo{display:flex;justify-content:center;align-items:center;gap:10px;font-size:22px;font-weight:700}.auth .logo img{width:34px;border-radius:9px}
.auth h1{text-align:center;font-size:26px;margin:16px 0 6px}.auth .s{text-align:center;color:#9ca3af;margin-bottom:24px}.auth .c{background:#0b0b0e;border:1px solid #232329;border-radius:16px;padding:26px}
.auth label{display:flex;justify-content:space-between;font-size:14px;margin:14px 0 8px}.auth input.f{background:#121216;border-color:#26262d;color:#fff}.auth a.l{color:#8b5cf6}
.auth .btn{width:100%;margin-top:18px;background:#7c3aed;padding:12px}.auth .or{display:flex;align-items:center;gap:12px;color:#6b7280;font-size:12px;letter-spacing:.1em;margin:22px 0}.auth .or:before,.auth .or:after{content:"";height:1px;background:#26262d;flex:1}
.auth .btn.d{background:#5865f2;margin:0 0 10px}.auth .btn.gg{background:#fff;color:#111;margin:0}.err{color:#f87171;font-size:14px;margin-top:12px}.auth .ft{text-align:center;color:#9ca3af;margin-top:22px;font-size:14px}
@media(max-width:820px){#side{position:fixed;left:0;top:0;bottom:0;margin:0;border-radius:0 18px 18px 0;height:auto;transform:translateX(-110%);transition:transform .3s;overflow:auto}#side.open{transform:none}#mb{display:grid}.g2{grid-template-columns:1fr}header{padding-left:16px}#view{padding:8px 16px 48px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div id="app"></div>
<script>var B=location.pathname.indexOf('/billing')==0?'/billing':'';document.write('<script src="'+B+'/app.js"><\/script>')</script>
</body></html>
